<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="images/icon.png" />
    <link rel="stylesheet" href="index.css" />
    <title>Personal Dashboard</title>
  </head>
  <body>
    <main>
      <div class="top-page">
        <div id="news-container">
          <div id="news">News</div>
          <button id="refresh-news" title="Fetch new articles">↺</button>
        </div>
        <div id="weather-container">
          <div id="location-header">
            <span id="location-status"></span>
            <button
              id="reset-location"
              title="Reset to geolocation"
              class="hidden"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="width: 14px; height: 14px"
              >
                <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
              </svg>
            </button>
          </div>
          <div id="weather"></div>
          <div id="location-input-group" class="hidden">
            <input
              type="text"
              id="city-input"
              placeholder="Enter city name..."
            />
            <button id="submit-city">OK</button>
          </div>
          <button id="edit-location-btn">Edit Location ✎</button>
        </div>
      </div>
      <div class="center-container">
        <h2 id="greeting">Hello</h2>
        <div id="time-container">
          <h1 class="time">TIME</h1>
          <button id="time-format-btn" title="Toggle 12h/24h">24h</button>
        </div>
        <form
          action="https://www.google.com/search"
          method="GET"
          id="search-form"
          target="_blank"
        >
          <input
            type="text"
            name="q"
            placeholder="Search Google..."
            autocomplete="off"
          />
        </form>
      </div>
      <div id="footer">
        <div id="author-container"></div>
        <button id="refresh-bg" title="Get new background">↺</button>
      </div>
    </main>
    <script src="config.js"></script>
    <script src="index.js"></script>
  </body>
</html>
